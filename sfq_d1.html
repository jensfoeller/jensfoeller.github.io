  <style>
    :root {
      --primary: #1b75d0;
      --primary-hover: #135ba1;
      --text: #2d2d2d;
      --muted: #6b7280;
      --bg: #f8f9fa;
      --card-bg: #ffffff;
      --border: #e5e7eb;
      --success: #047857;
      --error: #dc2626;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 2rem;
    }

    h1 {
      font-size: 1.75rem;
      margin-bottom: 1.5rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
    }

    .question {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 1rem;
    }

    .option-label {
      display: block;
      margin-bottom: 0.5rem;
      font-family: 'Courier New', monospace;
      color: var(--muted);
      cursor: pointer;
    }

    input[type="radio"] {
      margin-right: 0.5rem;
    }

    .button-row {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }

    .check-button,
    .reset-button {
      border: none;
      border-radius: 4px;
      padding: 0.4rem 1rem;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .check-button {
      background-color: var(--primary);
      color: white;
    }

    .check-button:hover {
      background-color: var(--primary-hover);
    }

    .reset-button {
      background-color: #e5e7eb;
      color: var(--text);
    }

    .reset-button:hover {
      background-color: #d1d5db;
    }

    .feedback {
      margin-top: 0.75rem;
      font-weight: 600;
      font-family: 'Courier New', monospace;
    }

    .correct {
      color: var(--success);
    }

    .incorrect {
      color: var(--error);
    }

    .explanation {
      margin-top: 0.5rem;
      font-size: 0.92rem;
      color: var(--text);
      background-color: #f1f5f9;
      padding: 0.75rem;
      border-left: 4px solid var(--primary);
      border-radius: 4px;
    }

    @media (max-width: 600px) {
      body {
        padding: 1rem;
      }

      .button-row {
        flex-direction: column;
      }
    }
  </style>
</head>

    explanation.innerText = item.explanation;

    const checkButton = document.createElement('button');
    checkButton.className = 'check-button';
    checkButton.innerText = 'Antwort prüfen';

    checkButton.onclick = () => {
      const selected = card.querySelector(`input[name="${formName}"]:checked`);
      if (!selected) {
        feedback.innerText = 'Bitte eine Antwort auswählen.';
        feedback.className = 'feedback incorrect';
        explanation.style.display = 'none';
        return;
      }
      const correct = item.answer;
      if (selected.value === correct) {
        feedback.innerText = `✅ Richtig! (${correct})`;
        feedback.className = 'feedback correct';
      } else {
        feedback.innerText = `❌ Falsch. Richtige Antwort: ${correct}`;
        feedback.className = 'feedback incorrect';
      }
      explanation.style.display = 'block';
    };

    const resetButton = document.createElement('button');
    resetButton.className = 'reset-button';
    resetButton.innerText = 'Zurücksetzen';

    resetButton.onclick = () => {
      radioInputs.forEach(input => input.checked = false);
      feedback.innerText = '';
      feedback.className = 'feedback';
      explanation.style.display = 'none';
    };

    const buttonRow = document.createElement('div');
    buttonRow.className = 'button-row';
    buttonRow.appendChild(checkButton);
    buttonRow.appendChild(resetButton);

    card.appendChild(buttonRow);
    card.appendChild(feedback);
    card.appendChild(explanation);
    container.appendChild(card);
  });
</script>

</body>
</html>
