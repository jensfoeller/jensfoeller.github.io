<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Snowflake-Style Quiz</title>
  <style>
    :root {
      --primary: #1b75d0;
      --primary-hover: #135ba1;
      --text: #2d2d2d;
      --muted: #6b7280;
      --bg: #f8f9fa;
      --card-bg: #ffffff;
      --border: #e5e7eb;
      --success: #047857;
      --error: #dc2626;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 2rem;
    }

    h1 {
      font-size: 1.75rem;
      margin-bottom: 1.5rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
    }

    .question {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 1rem;
    }

    .option-label {
      display: block;
      margin-bottom: 0.5rem;
      font-family: 'Courier New', monospace;
      color: var(--muted);
      cursor: pointer;
    }

    input[type="radio"] {
      margin-right: 0.5rem;
    }

    .button-row {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }

    .check-button,
    .reset-button {
      border: none;
      border-radius: 4px;
      padding: 0.4rem 1rem;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .check-button {
      background-color: var(--primary);
      color: white;
    }

    .check-button:hover {
      background-color: var(--primary-hover);
    }

    .reset-button {
      background-color: #e5e7eb;
      color: var(--text);
    }

    .reset-button:hover {
      background-color: #d1d5db;
    }

    .feedback {
      margin-top: 0.75rem;
      font-weight: 600;
      font-family: 'Courier New', monospace;
    }

    .correct {
      color: var(--success);
    }

    .incorrect {
      color: var(--error);
    }

    .explanation {
      margin-top: 0.5rem;
      font-size: 0.92rem;
      color: var(--text);
      background-color: #f1f5f9;
      padding: 0.75rem;
      border-left: 4px solid var(--primary);
      border-radius: 4px;
    }

    @media (max-width: 600px) {
      body {
        padding: 1rem;
      }

      .button-row {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

<h1>Snowflake Quiz Trainer</h1>
<div id="quiz-container"></div>

<script>
  const questions = [
       {
    "id": "A.4",
    "question": "Which layer in Snowflake is responsible for query optimization and metadata management?",
    "options": [
      "A. Compute layer",
      "B. Cloud services layer",
      "C. Storage layer",
      "D. UI layer"
    ],
    "answer": "B",
    "explanation": "The Cloud Services layer in Snowflake handles metadata management, query parsing, and optimization. It acts as the central brain coordinating authentication, infrastructure management, and query execution."
  },
  {
    "id": "A.5",
    "question": "Which feature allows developers to write code in languages like Python within Snowflake?",
    "options": [
      "A. SnowSQL",
      "B. SnowCD",
      "C. Snowpark",
      "D. Snowflake SQL API"
    ],
    "answer": "C",
    "explanation": "Snowpark enables developers to write Snowflake operations using Python, Java, and Scala. It provides a way to build complex transformations and applications natively inside Snowflake."
  },
  {
    "id": "A.6",
    "question": "Which tool provides a web-based UI for data exploration and query development in Snowflake?",
    "options": [
      "A. SnowSQL",
      "B. Cortex",
      "C. Snowsight",
      "D. SnowCD"
    ],
    "answer": "C",
    "explanation": "Snowsight is Snowflake’s modern, browser-based interface that allows users to run queries, explore data, and create visual dashboards. It simplifies interacting with databases compared to command-line tools."
  },
  {
    "id": "A.7",
    "question": "Which Snowflake object enables secure, reusable logic for data transformation that returns a single value?",
    "options": [
      "A. Task",
      "B. UDF",
      "C. Stream",
      "D. View"
    ],
    "answer": "B",
    "explanation": "User-Defined Functions (UDFs) allow users to write custom logic that returns a single scalar value. UDFs are useful for encapsulating business rules or transformations securely inside Snowflake."
  },
  {
    "id": "A.8",
    "question": "What type of Snowflake object stores tabular data and is persistent across sessions?",
    "options": [
      "A. Temporary table",
      "B. Transient table",
      "C. Permanent table",
      "D. External table"
    ],
    "answer": "C",
    "explanation": "Permanent tables store tabular data reliably and persist even after user sessions end. They support features like Fail-safe and Time Travel for data protection."
  },
  {
    "id": "A.9",
    "question": "Which Snowflake service supports building and hosting interactive applications directly in the platform?",
    "options": [
      "A. SnowCD",
      "B. Streamlit in Snowflake",
      "C. Cortex",
      "D. Snowsight"
    ],
    "answer": "B",
    "explanation": "Streamlit in Snowflake allows users to develop and host interactive data apps without leaving the Snowflake environment. This brings application building closer to data without separate infrastructure."
  },
  {
    "id": "A.10",
    "question": "Which object in Snowflake allows you to track changes to a table for use in data pipelines?",
    "options": [
      "A. Task",
      "B. Pipe",
      "C. Stream",
      "D. Stage"
    ],
    "answer": "C",
    "explanation": "A Stream captures insert, update, and delete changes on a table. It provides a change data capture (CDC) mechanism essential for building incremental data pipelines."
  },
  {
    "id": "A.11",
    "question": "Which Snowflake feature enables querying and managing external files stored in cloud storage?",
    "options": [
      "A. External tables",
      "B. Internal stages",
      "C. Schema-less tables",
      "D. Snowpipe"
    ],
    "answer": "A",
    "explanation": "External tables let Snowflake query data stored outside the database without needing to load it first. They are commonly used to read data from cloud storage platforms like S3 or Azure Blob Storage."
  },
  {
    "id": "A.12",
    "question": "What does the term 'elastic compute' refer to in the context of Snowflake?",
    "options": [
      "A. Scaling storage independently",
      "B. Decoupling metadata from compute",
      "C. Scaling compute resources up and down on demand",
      "D. Storing semi-structured data"
    ],
    "answer": "C",
    "explanation": "Elastic compute means that Snowflake can automatically scale its compute clusters based on workload needs. It ensures high performance by allocating or reducing compute resources without manual intervention."
  },
  {
    "id": "A.13",
    "question": "Which of the following is a tool for command-line access to Snowflake?",
    "options": [
      "A. SnowSQL",
      "B. Snowpark",
      "C. Cortex",
      "D. Snowsight"
    ],
    "answer": "A",
    "explanation": "SnowSQL is a CLI (Command-Line Interface) client that provides a way to connect to Snowflake, execute SQL queries, and perform administrative tasks. It's ideal for developers and administrators."
  },
  {
    "id": "A.14",
    "question": "Which object is used to define a logical group of objects in Snowflake?",
    "options": [
      "A. Database",
      "B. Stage",
      "C. Schema",
      "D. Pipe"
    ],
    "answer": "C",
    "explanation": "A schema is a logical container for organizing tables, views, and other objects within a database. It helps manage and group related database objects in a structured way."
  },
  {
    "id": "A.15",
    "question": "What is the function of a 'task' object in Snowflake?",
    "options": [
      "A. Granting user access",
      "B. Executing SQL on a schedule",
      "C. Loading external data",
      "D. Generating reports"
    ],
    "answer": "B",
    "explanation": "Tasks in Snowflake allow the scheduling and automation of SQL statements. They are essential for workflows such as data transformation or pipeline orchestration."
  },
  {
    "id": "A.16",
    "question": "Which object type allows sharing data across accounts without copying it?",
    "options": [
      "A. Share",
      "B. UDTF",
      "C. Stage",
      "D. View"
    ],
    "answer": "A",
    "explanation": "A share object enables Snowflake users to provide secure, read-only access to their datasets across different Snowflake accounts without physically moving or copying the data."
  },
  {
    "id": "A.17",
    "question": "What is a key benefit of micro-partitioning in Snowflake?",
    "options": [
      "A. Supports real-time dashboards",
      "B. Enhances network security",
      "C. Enables efficient data pruning",
      "D. Provides built-in version control"
    ],
    "answer": "C",
    "explanation": "Micro-partitioning automatically divides large datasets into smaller partitions, which Snowflake uses to skip irrelevant data during queries. This greatly improves performance and query efficiency."
  },
  {
    "id": "A.18",
    "question": "Which Snowflake object is used to orchestrate data loading with Snowpipe?",
    "options": [
      "A. Task",
      "B. Stream",
      "C. Pipe",
      "D. Stage"
    ],
    "answer": "C",
    "explanation": "Pipes define the connection between a stage and a Snowflake table, allowing Snowpipe to automatically load new files as they arrive. It automates continuous data ingestion."
  },
  {
    "id": "A.19",
    "question": "Which user interface is best suited for monitoring account-level costs and performance metrics?",
    "options": [
      "A. SnowSQL",
      "B. Cortex",
      "C. Snowsight",
      "D. Streamlit"
    ],
    "answer": "C",
    "explanation": "Snowsight provides dashboards for query profiling, usage statistics, and cost monitoring. It’s ideal for administrators and analysts to track Snowflake environment health."
  },
  {
    "id": "A.20",
    "question": "What is the purpose of a Snowflake sequence object?",
    "options": [
      "A. Automatically increment values for primary keys",
      "B. Enforce security policies",
      "C. Manage file formats",
      "D. Persist query results"
    ],
    "answer": "A",
    "explanation": "Sequences generate unique incremental numbers that can be used, for example, to populate primary key columns. They are critical in maintaining unique identifiers for records."
  },
  {
    "id": "A.21",
    "question": "Which object type can return a set of rows and is created using SQL logic?",
    "options": [
      "A. UDF",
      "B. UDTF",
      "C. Pipe",
      "D. View"
    ],
    "answer": "B",
    "explanation": "User-Defined Table Functions (UDTFs) allow you to write functions that return multiple rows, not just a single value. They are powerful for dynamic result set generation in SQL."
  },
  {
    "id": "A.22",
    "question": "Which Snowflake interface supports RESTful programmatic access?",
    "options": [
      "A. SnowSQL",
      "B. SnowCD",
      "C. Snowflake SQL API",
      "D. Cortex"
    ],
    "answer": "C",
    "explanation": "The Snowflake SQL API enables applications to access Snowflake programmatically using REST APIs. This facilitates integration with external systems and automation of operations."
  },
  {
    "id": "A.23",
    "question": "Which Snowflake feature supports building GenAI and ML capabilities natively?",
    "options": [
      "A. SnowSQL",
      "B. Cortex",
      "C. Streamlit",
      "D. Tasks"
    ],
    "answer": "B",
    "explanation": "Cortex is Snowflake’s platform for GenAI and machine learning capabilities. It offers services like LLMs (Large Language Models) and vector search natively within the platform."
  },
  {
    "id": "A.24",
    "question": "What is the main benefit of Snowflake’s interoperable storage layer?",
    "options": [
      "A. Supports multi-cloud compute engines",
      "B. Allows storage to scale independently of compute",
      "C. Requires external data lakes for storage",
      "D. Tightly couples compute and storage"
    ],
    "answer": "B",
    "explanation": "Snowflake’s storage is decoupled from compute, allowing independent scaling of storage capacity. This provides flexibility and cost-efficiency when managing large datasets."
  }
  ];

  const container = document.getElementById('quiz-container');

  questions.forEach((item, index) => {
    const card = document.createElement('div');
    card.className = 'card';

    const question = document.createElement('div');
    question.className = 'question';
    question.innerText = `Question ${item.id}: ${item.question}`;
    card.appendChild(question);

    const formName = `q${index}`;
    const radioInputs = [];

    item.options.forEach((opt) => {
      const label = document.createElement('label');
      label.className = 'option-label';

      const input = document.createElement('input');
      input.type = 'radio';
      input.name = formName;
      input.value = opt.charAt(0); // "A", "B", ...
      label.appendChild(input);
      label.appendChild(document.createTextNode(opt));
      card.appendChild(label);

      radioInputs.push(input);
    });

    const feedback = document.createElement('div');
    feedback.className = 'feedback';

    const explanation = document.createElement('div');
    explanation.className = 'explanation';
    explanation.style.display = 'none';
    explanation.innerText = item.explanation;

    const checkButton = document.createElement('button');
    checkButton.className = 'check-button';
    checkButton.innerText = 'Antwort prüfen';

    checkButton.onclick = () => {
      const selected = card.querySelector(`input[name="${formName}"]:checked`);
      if (!selected) {
        feedback.innerText = 'Bitte eine Antwort auswählen.';
        feedback.className = 'feedback incorrect';
        explanation.style.display = 'none';
        return;
      }
      const correct = item.answer;
      if (selected.value === correct) {
        feedback.innerText = `✅ Richtig! (${correct})`;
        feedback.className = 'feedback correct';
      } else {
        feedback.innerText = `❌ Falsch. Richtige Antwort: ${correct}`;
        feedback.className = 'feedback incorrect';
      }
      explanation.style.display = 'block';
    };

    const resetButton = document.createElement('button');
    resetButton.className = 'reset-button';
    resetButton.innerText = 'Zurücksetzen';

    resetButton.onclick = () => {
      radioInputs.forEach(input => input.checked = false);
      feedback.innerText = '';
      feedback.className = 'feedback';
      explanation.style.display = 'none';
    };

    const buttonRow = document.createElement('div');
    buttonRow.className = 'button-row';
    buttonRow.appendChild(checkButton);
    buttonRow.appendChild(resetButton);

    card.appendChild(buttonRow);
    card.appendChild(feedback);
    card.appendChild(explanation);
    container.appendChild(card);
  });
</script>

</body>
</html>
